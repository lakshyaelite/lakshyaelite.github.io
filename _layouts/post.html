---
layout: default
---


<main class="article">
    <a href="/" class="back-link">&larr; Back to posts</a>
    <header class="article-header">

        <h1>{{ page.title }}</h1>

        {% if page.tags %}
        <div class="post-tags article-tags">
            {% for tag in page.tags %}
            <span class="post-tag">{{ tag }}</span>
            {% endfor %}
        </div>
        {% endif %}
        
        <div class="article-meta">
            <span>{{ page.date | date: "%B %d, %Y" }}</span>
            &bull;
            <span>Views: <div id="stats"></div></span>
        </div>
    </header>
    {% if page.image %}
    <img src="{{ page.image }}" alt="Featured image" class="article-cover">
    {% endif %}
    <div class="article-content">
        <p class="article-intro">
            {{ page.description }}
        </p>

        {{ content }}
    </div>

    <footer class="article-footer">
            <a href="/">&larr; Back to all posts</a>
    </footer>
    <br>
    <script src="https://giscus.app/client.js"
            data-repo="lakshyaelite/lakshyaelite.github.io"
            data-repo-id="R_kgDOViQ38Q"
            data-category="General"
            data-category-id="DIC_kwDOViQ38c4DKWLn"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="top"
            data-theme="preferred_color_scheme"
            data-lang="en"
            data-loading="lazy"
            crossorigin="anonymous"
            async>
    </script>
    <script>
        let r = new XMLHttpRequest();
        r.addEventListener('load', function() {
            document.querySelector('#stats').innerText = JSON.parse(this.responseText).count
        })

        // Should be exact (encoded) path as it appears in the UI. This uses
        // GoatCounter's count.js
        let path = window.goatcounter.get_data()['p']

        // Or alternatively, do it manually. Will return HTTP status 404 if the
        // path is not found).
        //let path = location.pathname

        r.open('GET', 'https://lakshyaelite.goatcounter.com/counter/' + encodeURIComponent(path) + '.json')
        r.send()
    </script>
</main>
