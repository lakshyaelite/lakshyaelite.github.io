---
layout: default
---


<main class="article">
    <a href="/" class="back-link">&larr; Back to posts</a>
    <header class="article-header">

        <h1>{{ page.title }}</h1>

        {% if page.tags %}
        <div class="post-tags article-tags">
            {% for tag in page.tags %}
            <span class="post-tag">{{ tag }}</span>
            {% endfor %}
        </div>
        {% endif %}
        
        <div class="article-meta">
            <span>{{ page.date | date: "%B %d, %Y" }}</span>
            &bull;
            <span>Views: <div id="stats"></div></span>
        </div>
    </header>
    {% if page.image %}
    <img src="{{ page.image }}" alt="Featured image" class="article-cover">
    {% endif %}
    <div class="article-content">
        {{ content }}
    </div>

    <footer class="article-footer">
            <a href="/">&larr; Back to all posts</a>
    </footer>
    <br>
    <script src="https://giscus.app/client.js"
            data-repo="lakshyaelite/lakshyaelite.github.io"
            data-repo-id="R_kgDOViQ38Q"
            data-category="General"
            data-category-id="DIC_kwDOViQ38c4DKWLn"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="top"
            data-theme="preferred_color_scheme"
            data-lang="en"
            data-loading="lazy"
            crossorigin="anonymous"
            async>
    </script>
    <script>
        let postPath = new URL(window.location.href).pathname;
        let statsDiv = document.getElementById("stats");
        fetch(`https://lakshyaelite.goatcounter.com/counter/${encodeURIComponent(postPath)}.json`)
            .then(response => response.json())
            .then(data => {
                statsDiv.textContent = data.value;
            })
            .catch(error => {
                console.error('Error fetching view count:', error);
                statsDiv.textContent = 'N/A';
            });
    </script>
</main>
