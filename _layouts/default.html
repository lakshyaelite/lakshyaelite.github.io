<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/styles.css">

    <!-- Quicklink -->
    <script defer src="https://cdn.jsdelivr.net/npm/quicklink@3.0.2/dist/quicklink.umd.js"></script>
    <script>
    window.addEventListener('load', () => {
        quicklink.listen();
    });
    </script>

    <!-- Favicon links -->
    <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/favicons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/assets/favicons/favicon.svg" />
    <link rel="shortcut icon" href="{{ site.baseurl }}/assets/favicons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/assets/favicons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Lakshya's Blog" />
    <link rel="manifest" href="{{ site.baseurl }}/assets/favicons/site.webmanifest" />

    <!-- SEO -->
    <meta name="description" content="{{ page.description }}">
    <meta name="keywords" content="{{ page.keywords }}">
    <meta name="author" content="{{ site.author }}">
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.description }}">
    <meta property="og:image" content="{{ page.image }}">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="{{ page.title }}">
    <meta property="twitter:description" content="{{ page.description }}">
    <meta property="twitter:image" content="{{ page.image }}">

    <title>{{ site.title }}</title>
</head>
<body>
    <div class="hero">
        <div class="hero-content">
            <h1>{{ site.title }}</h1>
            <p>{{ site.description }}</p>
            <a href="{{ site.baseurl }}/feed.xml" class="rss-button" target="_blank">
                <svg role="img" viewBox="0 0 24 24" height="20px" width="20px" fill="white" xmlns="http://www.w3.org/2000/svg"><title>RSS</title><path d="M19.199 24C19.199 13.467 10.533 4.8 0 4.8V0c13.165 0 24 10.835 24 24h-4.801zM3.291 17.415c1.814 0 3.293 1.479 3.293 3.295 0 1.813-1.485 3.29-3.301 3.29C1.47 24 0 22.526 0 20.71s1.475-3.294 3.291-3.295zM15.909 24h-4.665c0-6.169-5.075-11.245-11.244-11.245V8.09c8.727 0 15.909 7.184 15.909 15.91z"/></svg> Subscribe
            </a>
        </div>
    </div>
    <div class="section">
        {{ content }}
    </div>
    <script data-goatcounter="https://lakshyaelite.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
